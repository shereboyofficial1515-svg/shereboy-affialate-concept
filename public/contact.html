      <h1>Get in Touch</h1>
      <p>Questions about a product, a deal, or a partnership? We read every message.</p>
    </div>
  </section>

  <section class="section">
    <div class="container" style="max-width:640px;">
      <div class="form-card">
        <form id="contactForm">
          <div class="form-row">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" required />
          </div>
          <div class="form-row">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-row">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="e.g. Question about a product" />
          </div>
          <div class="form-row">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send Message</button>
          <div class="form-msg" id="contactMsg" style="display:none;"></div>
        </form>
      </div>
